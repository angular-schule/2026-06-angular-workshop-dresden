@let b = book();
<article class="card mb-4">
  <div class="card-body bg-light">
    <img class="img-thumbnail float-end" alt=""
      src="https://api.angular.schule/avatar/{{ b.rating }}">
    <header class="card-title">
      <h2>{{ b.title }}</h2>
      <span class="badge rounded-pill text-bg-secondary">
        Bewertung: {{ b.rating }}
      </span>
    </header>
    <p>{{ b.description }}</p>
    <p><strong>Preis:</strong> {{ b.price | currency:'EUR' }}</p>

    <button type="button" class="btn btn-red"
        aria-label="Rating verringern" (click)="doRateDown()" [disabled]="rateDownDisabled()">–</button>

    <button type="button" class="btn btn-green"
        aria-label="Rating erhöhen" (click)="doRateUp()" [disabled]="rateUpDisabled()">+</button>

    <button type="button" class="btn btn-yellow" (click)="doDeleteBook()">Löschen</button>
    <button type="button" class="btn btn-red" (click)="doLike()">&#9829; Like</button>

    <a [routerLink]="['/books', b.isbn]">Details</a>
    
    <!--<a routerLink="/books">Dashboard</a>
    <a routerLink="/books/{{ b.isbn }}">Details</a>
    <a [routerLink]="'/books/' + b.isbn">Details</a>
    <a [routerLink]="['.', b.isbn]">Details</a>
    <a [routerLink]="[b.isbn]">Details</a>
    <a [routerLink]="b.isbn">Details</a>
    <a routerLink="{{ b.isbn }}">Details</a>-->
  </div>
</article>
