@if (books.isLoading()) {
    <div>Wird geladen …</div>
}

@if (books.hasValue()) {
    @for (b of books.value(); track b.isbn) {
        <app-book-card [book]="b" [min]="1" [max]="5"
            (rateUp)="doRateUp($event)"
            (rateDown)="doRateDown($event)"
            (delete)="doDeleteBook($event)"
            (like)="doLikeBook($event)" />
    }
}
