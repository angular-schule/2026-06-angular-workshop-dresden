<main class="container">
  <h1>{{ title() }}</h1>

  <nav class="mb-4">
    <a class="me-2" routerLink="/" routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">Home</a>
    <a class="me-2" routerLink="/books" routerLinkActive="active" ariaCurrentWhenActive="page">Books</a>
  </nav>

  <div>
    <button type="button" class="btn btn-green" (click)="authService.login()">Login</button>
    <button type="button" class="btn btn-red" (click)="authService.logout()">Logout</button>
    isAuthenticated: {{ authService.isAuthenticated() }}
  </div>

  <router-outlet />
</main>
